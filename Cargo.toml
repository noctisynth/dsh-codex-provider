[package]
name = "dsh-codex-provider"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi9", "async", "web_stream", "serde-json"] }
napi-derive = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"
openidconnect = { version = "4.1", default-features = false, features = ["reqwest", "rustls-tls", "timing-resistant-secret-traits"] }
axum = { version = "0.8", default-features = false, features = ["http1", "query", "tokio"] }
tokio = { version = "1", features = ["net", "sync", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }
eventsource-stream = "0.2"
futures-util = "0.3"
async-stream = "0.3"

[build-dependencies]
napi-build = "2"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[lints.rust]
unsafe_code = "deny"
