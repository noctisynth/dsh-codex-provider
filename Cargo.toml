[package]
name = "dsh-codex-provider"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi9", "async", "web_stream"] }
napi-derive = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[build-dependencies]
napi-build = "2"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[lints.rust]
unsafe_code = "deny"
